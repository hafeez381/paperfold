# The app's icon for macOS 26, compiled from desktop/build/icon.icon (the format Icon Composer writes) on macOS 26,
# where actool can draw it: actool on macOS 15 fails, and the Intel app is built on macOS 15. It runs when the icon
# changes (or by hand: Actions › icon › Run workflow); put its two files in desktop/build: Assets.car, which macOS 26
# draws the icon from, and icon.icns, the same icon flattened for earlier systems. The desktop builds take them from there.
name: icon
on:
  push:
    paths: ['desktop/build/icon.icon/**', '.github/workflows/icon.yml']
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: actool, as electron-builder runs it for a .icon
        run: |
          actool --version | grep -A1 short-bundle-version
          mkdir -p out
          cp -R desktop/build/icon.icon out/Icon.icon
          actool out/Icon.icon --compile out --output-format human-readable-text --notices --warnings \
            --output-partial-info-plist out/info.plist --app-icon Icon --include-all-app-icons \
            --enable-on-demand-resources NO --development-region en --target-device mac \
            --minimum-deployment-target 26.0 --platform macosx
          mv out/Icon.icns out/icon.icns
          iconutil -c iconset out/icon.icns -o out/preview.iconset
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: icon
          path: |
            out/Assets.car
            out/icon.icns
            out/info.plist
            out/preview.iconset
          if-no-files-found: error
